<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIDOS · 픽셀 디졸브</title>
<link rel="stylesheet" href="../../../../runtime/eidos-stage.css">
<style>
.scene { position:absolute; inset:0; padding:9vh 7vw 22vh; display:flex; flex-direction:column; gap:4vh; background:var(--eidos-bg); color:var(--eidos-fg); word-break:keep-all; }
/* Scene-scoped themes: the two scenes must differ in luminance so each dissolving cell reads as a tile. */
.scene.light { color-scheme:light; --eidos-bg:oklch(0.9818 0.0054 95.0986); --eidos-fg:oklch(0.3438 0.0269 95.7226); --eidos-surface:oklch(0.93 0.008 97); --eidos-surface-fg:oklch(0.1908 0.0020 106.5859); --eidos-muted-fg:oklch(0.5341 0.0078 97.4503); --eidos-accent:oklch(0.6171 0.1375 39.0427); }
.scene.dark { color-scheme:dark; --eidos-bg:oklch(0.2679 0.0036 106.6427); --eidos-fg:oklch(0.9576 0.0027 106.4494); --eidos-surface:oklch(0.3328 0.0018 106.5092); --eidos-surface-fg:oklch(0.9818 0.0054 95.0986); --eidos-muted-fg:oklch(0.7713 0.0169 99.0657); --eidos-accent:oklch(0.6724 0.1308 38.7559); }
.scene .eidos-title, .scene .box b { color:var(--eidos-surface-fg); }
.layout { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:20px; }
.box { padding:28px; border-radius:var(--eidos-radius); background:var(--eidos-surface); font-size:clamp(18px,2.5vw,28px); display:flex; flex-direction:column; gap:14px; }
.box small { font:17px var(--eidos-font-mono); color:var(--eidos-muted-fg); overflow-wrap:anywhere; }
.note { font-size:clamp(17px,2vw,24px); max-width:42em; color:var(--eidos-muted-fg); }
.version { font:700 clamp(48px,8vw,96px) var(--eidos-font-mono); color:var(--eidos-accent); }
@media(max-width:640px) { .scene { padding:6vh 6vw 25vh; gap:2vh; } .layout { grid-template-columns:1fr; gap:12px; } .box { padding:18px; gap:8px; } .eidos-title { font-size:30px; } }
</style>
</head>
<body>
<div class="eidos-stage"><div class="eidos-world">
<section class="scene light" id="old"><div class="eidos-label">같은 대시보드 · 라이트 테마</div><h1 class="eidos-title">같은 대시보드, 다른 테마</h1><div class="version">Light</div><div class="layout"><div class="box"><b>주문</b><small>--bg: light</small></div><div class="box"><b>매출</b><small>--bg: light</small></div><div class="box"><b>재고</b><small>--bg: light</small></div></div><p class="note">배치와 데이터는 그대로이고 색 토큰만 바뀝니다. 조각 교체는 편집 효과이며 실제 테마는 한 번에 적용됩니다.</p></section>
<section class="scene dark" id="fresh"><div class="eidos-label">같은 대시보드 · 다크 테마</div><h1 class="eidos-title">같은 대시보드, 다른 테마</h1><div class="version">Dark</div><div class="layout"><div class="box"><b>주문</b><small>--bg: dark</small></div><div class="box"><b>매출</b><small>--bg: dark</small></div><div class="box"><b>재고</b><small>--bg: dark</small></div></div><p class="note">배치와 데이터는 그대로이고 색 토큰만 바뀝니다. 조각 교체는 편집 효과이며 실제 테마는 한 번에 적용됩니다.</p></section>
</div></div>
<script src="../../../../runtime/eidos-stage.js"></script><script src="./technique.js"></script>
<script>
const s = Eidos.stage();
s.scene("old", { el:"#old", title:"라이트 테마" });
s.tl.wait(0.8).stop("라이트 테마: 같은 대시보드의 현재 모습입니다");
s.scene("fresh", { el:"#fresh", via:"pixel-dissolve", with:{cols:10, seed:7, dur:1.4},
  reason:"같은 화면을 라이트에서 다크 테마로 조각 단위 교체", title:"다크 테마" });
s.tl.wait(0.4).stop("다크 테마: 효과의 조각 순서와 실제 즉시 전환을 구분합니다");
s.start();
</script>
</body>
</html>
