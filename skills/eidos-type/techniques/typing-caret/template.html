<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIDOS · 타이핑 커서 (Typing Caret)</title>
<link rel="stylesheet" href="../../../../runtime/eidos-stage.css">
<style>
  .layout { position: absolute; inset: 0; margin: 0 auto; max-width: 820px; padding: 6vh 6vw 14vh; display: flex; flex-direction: column; gap: 2.5vh; word-break: keep-all; }
  .chat { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: flex-end; gap: 1.6vh; font-size: clamp(0.95rem, 1.5vw, 1.15rem); line-height: 1.55; }
  .msg { margin: 0; max-width: 82%; padding: 0.55em 0.85em; border-radius: var(--eidos-radius-sm); }
  .msg.user { align-self: flex-end; background: var(--eidos-fill-warm); }
  .msg.ai { align-self: flex-start; background: var(--eidos-surface); color: var(--eidos-surface-fg); border: 1px solid var(--eidos-border); }
  .field { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 0.75rem; padding: 0.75rem 0.9rem; border: 1px solid var(--eidos-border); border-radius: var(--eidos-radius); background: var(--eidos-surface); color: var(--eidos-surface-fg); box-shadow: var(--eidos-shadow); font-size: clamp(1rem, 1.7vw, 1.25rem); line-height: 1.55; }
  .text { display: grid; min-height: 1.55em; }
  .text > * { grid-area: 1 / 1; margin: 0; }
  .hint { color: var(--eidos-muted-fg); }
  .send { padding: 0.45em 0.9em; border-radius: var(--eidos-radius-sm); background: var(--eidos-accent); color: var(--eidos-accent-fg); font-weight: 600; font-size: 0.9em; white-space: nowrap; }
  code { font-family: var(--eidos-font-mono); font-size: 0.92em; }
</style>
</head>
<body>
<div class="eidos-stage">
  <div class="eidos-world">
    <main class="layout">
      <header>
        <div class="eidos-label">프롬프트 작성</div>
        <h1 class="eidos-title">맥락을 넣으면 답이 달라집니다</h1>
      </header>
      <section class="chat" id="chat">
        <p class="msg user" id="u1">이 함수 왜 느려?</p>
        <p class="msg ai" id="a1">어떤 함수인지, 어디서 느린지 알려 주시면 더 정확히 답할 수 있어요.</p>
        <p class="msg user" id="u2">getUsers()가 요청마다 테이블 전체를 읽어. N+1 쿼리인지 보고 인덱스로 고쳐 줘.</p>
        <p class="msg ai" id="a2">N+1 쿼리가 맞습니다. <code>users.org_id</code>에 인덱스를 걸고, 조직별로 한 번에 조인해서 가져오세요.</p>
      </section>
      <div class="field" id="field">
        <div class="text">
          <span class="hint" id="hint">메시지를 입력하세요</span>
          <p id="q1">이 함수 왜 느려?</p>
          <p id="q2">getUsers()가 요청마다 테이블 전체를 읽어. N+1 쿼리인지 보고 인덱스로 고쳐 줘.</p>
        </div>
        <span class="send" id="send">보내기</span>
      </div>
    </main>
  </div>
</div>
<script src="../../../../runtime/eidos-stage.js"></script>
<script src="./technique.js"></script>
<script>
  const s = Eidos.stage();
  const press = (p) => 1 - 0.08 * Math.sin(Math.PI * p);
  s.tl.tween("header", { opacity: [0, 1], y: [10, 0] }, { dur: 0.5, ease: "out" })
    .tween("#field", { opacity: [0, 1], y: [8, 0] }, { at: "<+=0.2", dur: 0.5, ease: "out" })
    .stop("빈 입력창입니다. 커서가 입력을 기다립니다");
  s.tl.tween("#hint", { opacity: [1, 0] }, { dur: 0.3 });
  s.fx("typing-caret", { targets: "#q1" });
  s.tl.stop("짧게 물으면 모델은 무엇을 봐야 할지 모릅니다");
  s.tl.tween("#send", { scale: press }, { dur: 0.3, ease: "linear" })
    .tween("#q1", { opacity: [1, 0] }, { at: "<+=0.1", dur: 0.2 })
    .tween("#u1", { opacity: [0, 1], y: [10, 0] }, { at: "<+=0.1", dur: 0.4, ease: "out" })
    .tween("#hint", { opacity: [0, 1] }, { at: "<+=0.1", dur: 0.2 })
    .tween("#a1", { opacity: [0, 1], y: [10, 0] }, { at: "<+=0.4", dur: 0.45, ease: "out" })
    .stop("맥락이 없으니 모델이 되묻습니다");
  s.tl.tween("#q2", { opacity: [0, 1] }, { dur: 0 });
  s.tl.tween("#hint", { opacity: [1, 0] }, { dur: 0.3 });
  s.fx("typing-caret", { targets: "#q2", cps: 22, seed: 7 });
  s.tl.stop("무엇이, 어디서, 어떻게 느린지 맥락을 넣습니다");
  s.tl.tween("#send", { scale: press }, { dur: 0.3, ease: "linear" })
    .tween("#q2", { opacity: [1, 0] }, { at: "<+=0.1", dur: 0.2 })
    .tween("#u2", { opacity: [0, 1], y: [10, 0] }, { at: "<+=0.1", dur: 0.4, ease: "out" })
    .tween("#hint", { opacity: [0, 1] }, { at: "<+=0.1", dur: 0.2 })
    .tween("#a2", { opacity: [0, 1], y: [10, 0] }, { at: "<+=0.4", dur: 0.45, ease: "out" })
    .stop("맥락이 있으면 같은 질문에도 구체적인 답이 옵니다");
  s.start();
</script>
</body>
</html>
