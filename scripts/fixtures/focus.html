<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EIDOS fixture · focus</title>
<link rel="stylesheet" href="../../runtime/eidos-stage.css">
<style>
  .scene { position: absolute; inset: 0; padding: 8vh 6vw; display: flex; flex-direction: column; gap: 3vh; }
  .box { width: 160px; padding: 12px; }
</style>
</head>
<body>
<div class="eidos-stage">
  <div class="eidos-world">
    <section class="scene">
      <h1 class="eidos-title">포커스 규칙</h1>
      <div class="eidos-card box" id="box">상자</div>
      <svg width="60" height="20" viewBox="0 0 60 20"><circle id="dot" cx="10" cy="10" r="5" fill="currentColor"/></svg>
      <div><label for="r" id="lab">값</label> <input id="r" type="range" min="0" max="10" value="3"></div>
      <button id="play" type="button">Play</button>
    </section>
  </div>
</div>
<script src="../../runtime/eidos-stage.js"></script>
<script>
  window.__eidosFixture = { focus: true };
  const s = Eidos.stage();
  const { tl } = s;
  tl.tween("#box", { opacity: [0, 1] }, { dur: 0.4 }).stop("하나", { id: "one", hold: 2 });
  tl.tween("#box", { x: [0, 120] }, { dur: 0.5 }).stop("둘");
  tl.tween("#box", { scale: [1, 1.3] }, { dur: 0.5 }).stop("셋");
  s.start();
</script>
</body>
</html>
